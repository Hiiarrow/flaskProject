<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Grade Calculation</title>
    <script>
        function toggleFields() {
            var mode = document.getElementById("mode").value;
            var hybridFields = document.getElementById("hybridFields");
            var theoryFields = document.getElementById("theoryFields");

            if (mode === "hybrid") {
                hybridFields.style.display = "block";
                theoryFields.style.display = "none";

                // Enable hybrid inputs and disable theory inputs
                hybridFields.querySelectorAll("input").forEach(input => input.required = true);
                theoryFields.querySelectorAll("input").forEach(input => input.required = false);
            } else if (mode === "theory") {
                hybridFields.style.display = "none";
                theoryFields.style.display = "block";

                // Enable theory inputs and disable hybrid inputs
                theoryFields.querySelectorAll("input").forEach(input => input.required = true);
                hybridFields.querySelectorAll("input").forEach(input => input.required = false);
            }
        }

        window.onload = toggleFields; // Ensure correct display on page load
    </script>
</head>
<body>
    <h1>Enter Your Marks</h1>
    <form action="/result" method="POST">
        <!-- Mode selection -->
        <label for="mode">Choose Mode:</label>
        <select name="mode" id="mode" onchange="toggleFields()">
            <option value="hybrid">Hybrid</option>
            <option value="theory">Theory</option>
        </select>

        <!-- Hybrid Fields -->
        <div id="hybridFields" style="display: block;">
            <label>MST 1:</label><input type="number" step="any" name="mst1"><br>
            <label>MST 2:</label><input type="number" step="any" name="mst2"><br>
            <label>Practical:</label><input type="number" step="any" name="practical"><br>
            <label>Quiz:</label><input type="number" step="any" name="quiz"><br>
            <label>Assignment:</label><input type="number" step="any" name="assignment"><br>
            <label>Surprise Test:</label><input type="number" step="any" name="surprise"><br>

            <!-- Experiment fields -->
            <label>Experiment 1:</label><input type="number" step="any" name="exp1"><br>
            <label>Experiment 2:</label><input type="number" step="any" name="exp2"><br>
            <label>Experiment 3:</label><input type="number" step="any" name="exp3"><br>
            <label>Experiment 4:</label><input type="number" step="any" name="exp4"><br>
            <label>Experiment 5:</label><input type="number" step="any" name="exp5"><br>
            <label>Experiment 6:</label><input type="number" step="any" name="exp6"><br>
            <label>Experiment 7:</label><input type="number" step="any" name="exp7"><br>
            <label>Experiment 8:</label><input type="number" step="any" name="exp8"><br>
            <label>Experiment 9:</label><input type="number" step="any" name="exp9"><br>
            <label>Experiment 10:</label><input type="number" step="any" name="exp10"><br>
        </div>

        <!-- Theory Fields -->
        <div id="theoryFields" style="display: none;">
            <label>MST 1:</label><input type="number" step="any" name="t_mst1"><br>
            <label>MST 2:</label><input type="number" step="any" name="t_mst2"><br>
            <label>Quiz:</label><input type="number" step="any" name="t_quiz"><br>
            <label>Assignment:</label><input type="number" step="any" name="t_assignment"><br>
            <label>Surprise Test:</label><input type="number" step="any" name="t_surprise"><br>
        </div>

        <!-- Common Field -->
        <label>Attendance (%):</label>
        <input type="number" step="any" name="attendance" required><br>

        <button type="submit">Submit</button>
    </form>
</body>
</html>
